name: async_wallpaper_example
description: Demonstrates how to use the async_wallpaper plugin.

publish_to: "none"

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  async_wallpaper:
    path: ../
  cupertino_icons: ^1.0.9
  dynamic_color: ^2.1.0
  file: ^7.0.1
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  material_ui: ^1.4.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true